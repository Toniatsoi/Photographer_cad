<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quijada Photography | Digital Business Card</title>
<meta name="description" content="Leonard Anthony C. Quijada, freelance photographer in Dauis, Bohol. Book a shoot, view my work or save my contact.">
<meta name="theme-color" content="#0e1012">
<meta property="og:type" content="profile">
<meta property="og:title" content="Quijada Photography | Digital Business Card">
<meta property="og:description" content="Freelance photographer. Tap to book a shoot or save my contact.">
<meta property="og:image" content="https://YOUR-SITE.example/preview.jpg">
<meta property="og:url" content="https://YOUR-SITE.example/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap">

<script>
/* ==========================================================================
   YOUR INFORMATION: EDIT ONLY THIS BLOCK
   ========================================================================== */
const PROFILE = {
  name:   "Leonard Anthony C. Quijada",
  first:  "Leonard Anthony",
  last:   "Quijada",
  title:  "Freelance Photographer",
  org:    "Quijada Photography",
  tagline:"Weddings, portraits and events, shot in natural light with honest moments.",
  location: "Dauis, Bohol, Philippines",

  phoneRaw:     "+639949782217",
  phoneDisplay: "+63 994 978 2217",
  email:   "quijadaleonardanthony1@gmail.com",
  website: "https://toniatsoi.github.io//portfolio/index.html",

  // Big cover portrait at the top. Best: a vertical photo of you or your best shot.
  photo: "photo.png",
  // Up to 3 sample photos (files beside this page or full URLs). Leave "" for a placeholder.
  gallery: ["", "", ""],

  services: ["Weddings","Portraits","Events","Graduation","Product","Real estate"],
  availability: [
    ["Mon – Sat", "Shoots by booking"],
    ["Sunday",    "Weddings & events"],
    ["Reply time","Within 24 hours"]
  ],

  socials: {
    facebook:  "https://www.facebook.com/leonardanthony.quijada.31",
    instagram: "", linkedin: "", github: "", tiktok: "", youtube: ""
  }
};
/* ========================================================================== */
</script>

<style>
:root{
  --bg:#0e1012; --card:#14171a; --raise:#1c2024; --line:#2a2f35;
  --ink:#f4f1ec; --muted:#a4aab1; --amber:#ff9a3c; --amber-ink:#2b1500;
}
i{display:inline-flex;font-style:normal}
svg.ic{width:1em;height:1em;display:block;flex:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:dark}
body{
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.55;
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
  display:flex;justify-content:center;
  background:radial-gradient(900px 500px at 50% -10%,#2a1c10,transparent 60%),var(--bg);
}
.card{width:100%;max-width:440px;margin:16px 0 28px;background:var(--card);border-radius:30px;overflow:hidden;
  box-shadow:0 30px 60px -30px #000,0 0 0 1px var(--line);animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400}

/* Full-bleed cover portrait with viewfinder marks */
.hero{position:relative;height:440px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 28px;overflow:hidden;
  background:radial-gradient(circle at 70% 25%,#6b3d17,transparent 55%),linear-gradient(160deg,#242a30,#101214)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hero .initials{position:absolute;top:34%;left:0;right:0;transform:translateY(-50%);text-align:center;font-family:"DM Serif Display",serif;font-size:7.5rem;color:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--card) 4%,rgba(20,23,26,.55) 42%,transparent 72%)}
.hero::after{content:"";position:absolute;inset:18px;z-index:1;pointer-events:none;--c:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7));
  background:var(--c) 0 0/22px 2px,var(--c) 0 0/2px 22px,var(--c) 100% 0/22px 2px,var(--c) 100% 0/2px 22px,
             var(--c) 0 100%/22px 2px,var(--c) 100% 100%/22px 2px,var(--c) 0 100%/2px 22px,var(--c) 100% 100%/2px 22px;
  background-repeat:no-repeat}
.brand{position:absolute;z-index:2;top:34px;left:34px;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  background:rgba(14,16,18,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:.85rem;font-weight:500}
.brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);animation:rec 1.8s ease-in-out infinite}
@keyframes rec{50%{opacity:.25}}
.hero h1,.hero .title,.hero .loc{position:relative;z-index:2;margin-left:10px}
h1{font-size:2.7rem;line-height:1.02;letter-spacing:-.01em;max-width:11ch;text-wrap:balance}
.title{margin-top:12px;color:var(--amber);font-weight:700;display:flex;align-items:center;gap:8px}
.loc{margin-top:2px;color:var(--muted);font-size:.92rem}

.section{padding:14px 22px}
.section h2{font-size:1.4rem;margin-bottom:12px}
.bio{color:#d6d3cd;font-size:1.02rem}

/* Quick actions */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;background:var(--raise);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;font-weight:500;font-size:.9rem;transition:transform .15s ease,border-color .15s ease}
.qa a i{font-size:1.4rem;color:var(--amber)}
.qa a:hover{transform:translateY(-2px);border-color:var(--amber)}
.qa a:active{transform:scale(.97)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:12px;border-radius:18px;
  font:inherit;font-weight:700;font-size:1.02rem;border:0;cursor:pointer;text-decoration:none;transition:transform .15s ease,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:var(--amber-ink);box-shadow:0 14px 28px -16px var(--amber)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}

/* Mosaic gallery: one large frame, two stacked */
.gallery{display:grid;grid-template-columns:1.25fr 1fr;grid-auto-rows:118px;gap:8px}
.shot{border-radius:14px;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.4);font-size:1.7rem}
.shot:nth-child(1){grid-row:span 2;background:linear-gradient(160deg,#3a4a57,#12181d)}
.shot:nth-child(2){background:linear-gradient(160deg,#5b4339,#1a1210)}
.shot:nth-child(3){background:linear-gradient(160deg,#3f5446,#101712)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.more{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--amber);font-weight:700;text-decoration:none}
.more:hover{text-decoration:underline}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--raise);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:500;font-size:.92rem}

.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 8px 8px 12px;border-radius:16px;background:var(--raise);border:1px solid var(--line);color:inherit;text-decoration:none}
.ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--card);color:var(--amber);display:grid;place-items:center;font-size:1.15rem;border:1px solid var(--line)}
.txt{flex:1;min-width:0}
.txt small{display:block;color:var(--muted);font-size:.8rem}
.txt span{display:block;font-weight:500;overflow-wrap:anywhere}
.inner{display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none}
a.row:hover{border-color:var(--amber)}
.copy{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
.copy:hover{background:var(--line);color:var(--ink)}
.copy.done{color:#4cd08a}

.hours div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hours div:last-child{border-bottom:0}
.hours dt{font-weight:700}
.hours dd{color:var(--muted);text-align:right}

.socials{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.socials a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;color:var(--ink);background:var(--raise);border:1px solid var(--line);text-decoration:none;transition:transform .15s ease,background .15s,color .15s}
.socials a:hover{transform:translateY(-3px);background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.socials a:active{transform:scale(.94)}

footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 22px 24px}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){h1{font-size:2.2rem}.hero{height:400px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="card">
  <header class="hero" id="hero">
    <span class="brand" id="brand"></span>
    <h1 id="name"></h1>
    <p class="title"><i data-i="camera"></i><span id="title"></span></p>
    <p class="loc" id="locHero"></p>
  </header>

  <section class="section">
    <p class="bio" id="bio"></p>
  </section>

  <section class="section">
    <nav class="qa" aria-label="Quick actions">
      <a id="qCall"><i data-i="phone"></i>Call</a>
      <a id="qMail"><i data-i="mail"></i>Email</a>
      <a id="qMap" target="_blank" rel="noopener noreferrer"><i data-i="pin"></i>Map</a>
    </nav>
  </section>

  <section class="section">
    <a class="btn primary" id="bookBtn"><i data-i="camera"></i> Book a shoot</a>
    <button class="btn ghost" id="saveBtn"><i data-i="contact"></i> Add to Contacts</button>
  </section>

  <section class="section" aria-labelledby="work-h">
    <h2 id="work-h">Selected work</h2>
    <div class="gallery" id="gallery"></div>
    <a class="more" id="moreWork" target="_blank" rel="noopener noreferrer"><i data-i="image"></i> View full portfolio</a>
  </section>

  <section class="section" aria-labelledby="serv-h">
    <h2 id="serv-h">What I shoot</h2>
    <div class="chips" id="services"></div>
  </section>

  <section class="section" aria-labelledby="contact-h">
    <h2 id="contact-h">Contact details</h2>
    <div class="list">
      <div class="row">
        <a id="phoneLink" class="inner"><span class="ico"><i data-i="phone"></i></span><span class="txt"><small>Call or text</small><span id="phoneText"></span></span></a>
        <button class="copy" id="copyPhone" aria-label="Copy phone number"><i data-i="copy"></i></button>
      </div>
      <div class="row">
        <a id="emailLink" class="inner"><span class="ico"><i data-i="mail"></i></span><span class="txt"><small>Email</small><span id="emailText"></span></span></a>
        <button class="copy" id="copyEmail" aria-label="Copy email address"><i data-i="copy"></i></button>
      </div>
      <a class="row" id="webLink" target="_blank" rel="noopener noreferrer"><span class="ico"><i data-i="globe"></i></span><span class="txt"><small>Portfolio website</small><span id="webText"></span></span></a>
    </div>
  </section>

  <section class="section" aria-labelledby="hours-h">
    <h2 id="hours-h">Availability</h2>
    <dl class="hours" id="hours"></dl>
  </section>

  <section class="section" id="social" aria-labelledby="social-h">
    <h2 id="social-h">Follow my work</h2>
    <div class="socials" id="socials"></div>
  </section>

  <footer id="foot"></footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const P = PROFILE, $ = id => document.getElementById(id);

  const IC = {
    phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    contact:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
    facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/>',
    linkedin:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    github:'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
    youtube:'<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><path d="m9.75 15.02 5.75-3.27-5.75-3.27z"/>',
    tiktok:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'
  };
  const ic = n => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
  document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = ic(e.dataset.i));

  $("brand").textContent = P.org;
  $("name").textContent = P.name;
  $("title").textContent = P.title;
  $("locHero").textContent = P.location;
  $("bio").textContent = P.tagline;
  $("phoneText").textContent = P.phoneDisplay;
  $("emailText").textContent = P.email;
  $("webText").textContent = P.website.replace(/^https?:\/\//,"");
  $("foot").textContent = "© " + new Date().getFullYear() + " " + P.org;

  // Cover portrait (falls back to big initials)
  const hero = $("hero");
  const showInitials = () => {
    const s = document.createElement("span"); s.className = "initials"; s.setAttribute("aria-hidden","true");
    s.textContent = (P.first[0] + P.last[0]).toUpperCase(); hero.prepend(s);
  };
  if (P.photo) {
    const img = new Image(); img.src = P.photo; img.alt = P.name;
    img.onerror = () => { img.remove(); showInitials(); };
    hero.prepend(img);
  } else showInitials();

  const tel = "tel:" + P.phoneRaw, map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(P.location);
  $("phoneLink").href = tel; $("qCall").href = tel; $("bookBtn").href = tel;
  $("emailLink").href = "mailto:" + P.email; $("qMail").href = "mailto:" + P.email;
  $("qMap").href = map;
  $("webLink").href = P.website; $("moreWork").href = P.website;

  (P.gallery || []).slice(0,3).forEach((src, n) => {
    const d = document.createElement("div"); d.className = "shot";
    const ph = () => { d.innerHTML = ic("image"); };
    if (src) {
      const im = new Image(); im.src = src; im.alt = "Sample photo " + (n + 1); im.loading = "lazy";
      im.onerror = ph; d.appendChild(im);
    } else ph();
    $("gallery").appendChild(d);
  });

  P.services.forEach(s => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = s; $("services").appendChild(c);
  });
  P.availability.forEach(h => {
    const d = document.createElement("div");
    const dt = document.createElement("dt"); dt.textContent = h[0];
    const dd = document.createElement("dd"); dd.textContent = h[1];
    d.append(dt, dd); $("hours").appendChild(d);
  });

  const icons = {
    facebook:["facebook","Facebook"], instagram:["instagram","Instagram"],
    linkedin:["linkedin","LinkedIn"], github:["github","GitHub"],
    tiktok:["tiktok","TikTok"], youtube:["youtube","YouTube"]
  };
  const alwaysShow = ["facebook","instagram","tiktok","youtube"];
  Object.keys(icons).forEach(k => {
    const url = P.socials[k];
    if (!url && !alwaysShow.includes(k)) return;
    const a = document.createElement("a");
    a.setAttribute("aria-label", icons[k][1] + " profile");
    if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
    else { a.href = "#"; a.addEventListener("click", e => { e.preventDefault(); toast(icons[k][1] + " link not added yet"); }); }
    a.innerHTML = ic(icons[k][0]);
    $("socials").appendChild(a);
  });

  let t; function toast(msg){
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  async function copy(text, btn, label){
    try { await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    btn.classList.add("done"); btn.innerHTML = ic("check");
    toast(label + " copied");
    setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = ic("copy"); }, 1800);
  }
  $("copyPhone").onclick = e => copy(P.phoneRaw, e.currentTarget, "Phone number");
  $("copyEmail").onclick = e => copy(P.email, e.currentTarget, "Email");

  function buildVCard(){
    const esc = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
    return [
      "BEGIN:VCARD","VERSION:3.0",
      "N:" + esc(P.last) + ";" + esc(P.first) + ";;;",
      "FN:" + esc(P.name),
      "ORG:" + esc(P.org),
      "TITLE:" + esc(P.title),
      "TEL;TYPE=CELL:" + P.phoneRaw,
      "EMAIL;TYPE=INTERNET:" + P.email,
      "URL:" + P.website,
      "ADR;TYPE=WORK:;;" + esc(P.location) + ";;;;",
      "END:VCARD"
    ].join("\r\n");
  }
  $("saveBtn").onclick = () => {
    const blob = new Blob([buildVCard()], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = P.last + "_" + P.first.replace(/\s+/g,"_") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Contact file ready. Open it to save.");
  };
})();
</script>
</body>
</html>
